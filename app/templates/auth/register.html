{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    {{ csrf_field() }}
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" maxlength="100" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="120" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="6" maxlength="128" required>
    <p><button class="btn" type="submit">Sign up</button></p>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
